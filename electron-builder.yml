appId: com.minidiary.desktop
productName: Mini Diary
copyright: Copyright © 2026 Mini Diary

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  - '!**/*.map'

asar: true

fileAssociations:
  - ext: minidiary
    name: Mini Diary 迁移包
    description: Mini Diary 迁移包（加密整库）
    role: Editor
    mimeType: application/x-minidiary

mac:
  category: public.app-category.lifestyle
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 Mini Diary

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: Mini Diary

linux:
  target:
    - AppImage
    - deb
  category: Utility
  artifactName: ${productName}-${version}-${arch}.${ext}
