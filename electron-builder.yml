appId: com.minidiary.desktop
productName: Mini Diary
copyright: Copyright © 2026 Mini Diary

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  - '!**/*.map'
  # 字体只把 PDF 用到的 4 个文件放进 extraResources，避免整套 75MB 字体进 asar
  - '!node_modules/@fontsource/**'

extraResources:
  - from: node_modules/@fontsource/noto-sans-sc/files
    to: fonts
    filter:
      - noto-sans-sc-chinese-simplified-400-normal.woff2
      - noto-sans-sc-chinese-simplified-700-normal.woff2
      - noto-sans-sc-latin-400-normal.woff2
      - noto-sans-sc-latin-700-normal.woff2

asar: true

# 无证书时在打包后做 ad-hoc 签名，避免「已损坏，无法打开」
afterPack: scripts/after-pack.cjs

fileAssociations:
  - ext: minidiary
    name: Mini Diary 迁移包
    description: Mini Diary 迁移包（加密整库）
    role: Editor
    mimeType: application/x-minidiary

mac:
  category: public.app-category.lifestyle
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 Mini Diary
    NSDocumentsFolderUsageDescription: Mini Diary 需要在你选择的文件夹里读写加密日记和附件。
    NSLocalNetworkUsageDescription: 连接本地 Git 代理或局域网 Git 仓库时，需要访问本地网络。

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: Mini Diary

linux:
  target:
    - AppImage
    - deb
  category: Utility
  artifactName: ${productName}-${version}-${arch}.${ext}
